name: Sync PR labels from referenced issue

# Reusable workflow. Copies the category labels (bug / enhancement /
# maintenance) of the issues a PR references in its body (`refs #N`, ...) onto
# the PR. It only adds labels; it never removes any.
#
# The caller owns the trigger and the token permissions. Minimal caller:
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize]
#   permissions:
#     issues: read
#     pull-requests: write
#   jobs:
#     sync-labels:
#       uses: travail/.github/.github/workflows/sync-pr-labels.yml@v1

on:
  workflow_call:

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Copy category labels from referenced issues onto this PR
        uses: actions/github-script@v9
        with:
          script: |
            const rawBody = context.payload.pull_request.body || '';
            // Strip fenced and inline code first, so quoted examples of
            // "refs #N" (e.g. in a Test plan describing this regex) are not
            // mistaken for real references.
            const body = rawBody.replace(/```[\s\S]*?```/g, '').replace(/`[^`]*`/g, '');
            const re = /\b(?:refs?|close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;

            // The category labels issues and PRs are classified with.
            const CATEGORY_LABELS = new Set(['bug', 'enhancement', 'maintenance']);

            const issueNumbers = new Set();
            let match;
            while ((match = re.exec(body)) !== null) {
              issueNumbers.add(Number(match[1]));
            }

            if (issueNumbers.size === 0) {
              core.info('No referenced issues found in PR body.');
              return;
            }

            const categoryLabels = new Set();
            for (const number of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                });
                for (const label of issue.labels) {
                  const name = typeof label === 'string' ? label : label.name;
                  if (name && CATEGORY_LABELS.has(name)) {
                    categoryLabels.add(name);
                  }
                }
              } catch (error) {
                core.warning(`Could not fetch issue #${number}: ${error.message}`);
              }
            }

            if (categoryLabels.size === 0) {
              core.info('No category labels found on referenced issue(s).');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: Array.from(categoryLabels),
            });

            core.info(`Applied labels: ${Array.from(categoryLabels).join(', ')}`);
