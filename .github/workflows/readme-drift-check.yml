name: README Drift Check

# Reusable workflow. Asks Gemini whether a PR's diff makes README.md out of
# date, and upserts (or removes) a warning comment on the PR. By default it is
# advisory only; set fail-on-drift: true to fail the job when drift is
# detected unless the readme-drift-ack label is present.
#
# The caller owns the trigger and the token permissions, and passes its own
# GEMINI_API_KEY (each repository keeps its own free-tier quota). Minimal
# caller:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     check-readme-drift:
#       uses: travail/.github/.github/workflows/readme-drift-check.yml@v1
#       with:
#         timeout-minutes: 3   # optional, defaults to 1
#       secrets:
#         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Timeout of the step that calls Gemini, in minutes.
        type: number
        default: 1
      tools-ref:
        description: >-
          Ref of travail/.github to fetch check_readme_drift.py from. Keep it
          in line with the ref this workflow is called at (the default matches
          @v1); override it only to test a branch.
        type: string
        default: v1
      fail-on-drift:
        description: >-
          Whether to fail the job when README drift is detected (unless the
          readme-drift-ack label is present on the PR).
        type: boolean
        default: false
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  check-readme-drift:
    # Dependabot PRs can't read GEMINI_API_KEY (Dependabot-triggered runs only see
    # the Dependabot secret store), and a version-number diff gives the model nothing
    # to judge README drift from anyway.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: check readme-drift-ack label and event action
        id: gate
        env:
          HAS_ACK_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'readme-drift-ack') }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          if [ "${HAS_ACK_LABEL}" = "true" ]; then
            echo "mode=ack" >> "$GITHUB_OUTPUT"
            echo "readme-drift-ack label is present; skipping README drift check."
          elif [ "${EVENT_ACTION}" = "labeled" ] || [ "${EVENT_ACTION}" = "unlabeled" ]; then
            if [ "${EVENT_LABEL}" != "readme-drift-ack" ]; then
              echo "mode=unrelated_label" >> "$GITHUB_OUTPUT"
              echo "Unrelated label event (${EVENT_ACTION}: ${EVENT_LABEL}); skipping Gemini check."
            else
              echo "mode=run" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=run" >> "$GITHUB_OUTPUT"
          fi

      - name: preserve drift failure state on unrelated label events
        if: steps.gate.outputs.mode == 'unrelated_label' && inputs.fail-on-drift
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- readme-drift-check -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            );
            if (existing) {
              core.setFailed(
                'README drift was previously detected. Update README.md or add the readme-drift-ack label if this is a false positive.',
              );
            }

      # The caller's PR.
      - uses: actions/checkout@v7
        if: steps.gate.outputs.mode == 'run'
        with:
          fetch-depth: 0

      # check_readme_drift.py, which lives in this repository.
      - uses: actions/checkout@v7
        if: steps.gate.outputs.mode == 'run'
        with:
          repository: travail/.github
          ref: ${{ inputs.tools-ref }}
          path: .readme-drift-tools
          # Only the script is read from this checkout, so do not leave the
          # token in its .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.mode == 'run'
        with:
          python-version: "3.13"

      - name: install google-genai
        if: steps.gate.outputs.mode == 'run'
        run: pip install google-genai

      - name: ask Gemini whether README.md needs updating
        id: check
        if: steps.gate.outputs.mode == 'run'
        # Safety net for a hang the script's own fallback logic can't catch:
        # that logic only reacts to a 429/503 the API actually returns, but
        # a request that just never responds raises no exception for it to
        # see (see travail/etiage#81). This is the only thing that can end
        # that case.
        timeout-minutes: ${{ inputs.timeout-minutes }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: python .readme-drift-tools/.github/scripts/check_readme_drift.py

      - name: upsert or remove the README drift comment
        if: steps.gate.outputs.mode == 'run'
        uses: actions/github-script@v9
        env:
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
          REASON: ${{ steps.check.outputs.reason }}
          FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        with:
          script: |
            const marker = '<!-- readme-drift-check -->';
            const needsUpdate = process.env.NEEDS_UPDATE === 'true';
            const failOnDrift = process.env.FAIL_ON_DRIFT === 'true';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (!needsUpdate) {
              // The drift is gone, so drop the verdict comment left by an earlier run.
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const footerLines = failOnDrift
              ? [
                  '> Judged automatically by Gemini. If this is a false positive,',
                  '> add the `readme-drift-ack` label to acknowledge and pass this check.',
                ]
              : [
                  '> Every other check can stay green while this one is true, so please',
                  '> look before merging. Judged automatically by Gemini, and advisory',
                  '> only: it never blocks a merge.',
                ];

            const reason = process.env.REASON;
            const body = [
              marker,
              '> [!WARNING]',
              '> ### :memo: README.md may be out of date',
              '>',
              ...reason.split('\n').map((line) => `> ${line}`),
              '>',
              ...footerLines,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (failOnDrift) {
              core.setFailed(
                'README drift detected. Update README.md or add the readme-drift-ack label if this is a false positive.',
              );
            }
