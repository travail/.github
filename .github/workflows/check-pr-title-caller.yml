name: Check PR title (self)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-pr-title:
    # This repository uses its own reusable workflow from the same checkout, so
    # a change is exercised by the pull request that makes it.
    uses: ./.github/workflows/check-pr-title.yml
